name: Build .dat files

on:
  push:
    branches:
      - master
    paths:
      - "geoip_config.json"
  repository_dispatch:
    types: [trigger-dat-build]
  workflow_dispatch:
    inputs:
      message:
        description: 'Release message'
        required: true
        type: string
      trigger:
        description: 'Trigger routing build'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout config and custom lists
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            geoip_config.json
            lists
          sparse-checkout-cone-mode: false
          path: publish

      - name: Checkout lists
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: itdoginfo/allow-domains
          sparse-checkout: |
            Russia/inside-raw.lst
            Russia/outside-raw.lst
            Ukraine/inside-raw.lst
            Categories
            Services
            Subnets
          sparse-checkout-cone-mode: false
          path: lists

      - name: Checkout geosite builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: v2fly/domain-list-community
          sparse-checkout: |
            main.go
            go.mod
            go.sum
            internal
          sparse-checkout-cone-mode: false
          path: geosite

      - name: Checkout geoip builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: v2fly/geoip
          path: geoip

      - name: Prepare lists
        run: |
          cd lists
          mkdir -p Countries
          ln "Russia/inside-raw.lst" "Countries/russia-inside.lst"
          ln "Russia/outside-raw.lst" "Countries/russia-outside.lst"
          ln "Ukraine/inside-raw.lst" "Countries/ukraine-inside.lst"
          input="../geosite/input"
          mkdir -p "$input"/{allow-domains,allow-categories,allow-countries,allow-services}
          declare -A groups=(
            ["Categories"]="-domains"
            ["Countries"]=""
            ["Services"]="-domains"
          )
          for group in "${!groups[@]}"; do
            for lst in ./"$group"/*; do
              [[ -f "$lst" ]] || continue
              list="$(basename "$lst" .lst | tr '_' '-')"
              [[ "$list" == "${list,,}" ]] || continue
              dest="${input}/${list}${groups[$group]}"
              mkdir -p "$dest"
              ln "$lst" "${dest}/list"
              ln "$lst" "${input}/allow-${group,,}/${list}"
              ln "$lst" "${input}/allow-domains/${list}"
            done
          done
          ip_input="../geoip/input"
          mkdir -p "$ip_input"
          for lst in ../publish/lists/subnets/*; do
            [[ -f "$lst" ]] || continue
            list="$(basename "$lst" .lst | tr '_' '-')"
            [[ "$list" == "${list,,}" ]] || continue
            ln "$lst" "${ip_input}/${list}"
          done
          for lst in ./Subnets/*/*; do
            [[ -f "$lst" ]] || continue
            list="$(basename "$lst" .lst | tr '_' '-')"
            [[ "$list" == "${list,,}" ]] || continue
            cat "$lst" >> "${ip_input}/${list}"
          done

      - name: Setup Go for geosite builder
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: geosite/go.mod
          cache-dependency-path: geosite/go.sum

      - name: Build domains .dat files
        run: |
          cd geosite
          for category in ./input/*/; do
            go run ./ \
              --datapath="$category" \
              --outputname="$(basename "$category").dat" \
              --outputdir="../publish/"
          done

      - name: Setup Go for geoip builder
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: geoip/go.mod
          cache-dependency-path: geoip/go.sum

      - name: Build subnets .dat files
        run: |
          cd geoip
          mkdir output
          go run ./ -c "../publish/geoip_config.json"
          for dat in ./output/*.dat; do
            [[ -f "$dat" ]] || continue
            ln "$dat" "../publish/$(basename "$dat" .dat)-subnets.dat"
          done

      - name: Generate checksums
        run: cd publish && sha256sum *.dat > checksums.txt

      - name: Set release tag
        run: echo "TAG_NAME=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      - name: Release and upload assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: "${{ env.TAG_NAME }}"
          name: "${{ env.TAG_NAME }}"
          body: "${{ env.RELEASE_MESSAGE }}"
          prerelease: false
          draft: false
          files: |
            publish/*.dat
            publish/checksums.txt
        env:
          RELEASE_MESSAGE: "${{
            inputs.message ||
            github.event.head_commit.message ||
            format('new lists release: {0}', github.event.client_payload.version) }}"

      - name: Trigger Happ routing rebuild
        if: inputs.trigger != 'false'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HAPP_ROUTING_TOKEN }}
          repository: KazZzeL/allow-domains-happ-routing
          event-type: trigger-routing-build
          client-payload: '{"version": "${{ env.TAG_NAME }}"}'
